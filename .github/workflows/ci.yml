name: source and package checks

# This workflow validates source and a standalone candidate artifact.
# It does not execute a real model or claim I01-I08 host acceptance.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned source dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build self-contained runtime
        run: npm run build
      - name: Unit regressions
        run: npm test
      - name: Build staged candidate
        run: npm run pack:release -- "${RUNNER_TEMP}/chio-candidate"
      - name: Verify artifact hashes and clean offline installation
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/chio-candidate"
          sha256sum --check ./*.sha256
          consumer_dir="$(mktemp -d "${RUNNER_TEMP}/chio-consumer.XXXXXX")"
          cache_dir="$(mktemp -d "${RUNNER_TEMP}/chio-empty-cache.XXXXXX")"
          cd "${consumer_dir}"
          printf '%s\n' '{"private":true}' > package.json
          npm install --offline --ignore-scripts --no-audit --no-fund \
            --cache "${cache_dir}" "${RUNNER_TEMP}/chio-candidate/"*.tgz
          node --input-type=module -e "await import('@chio/claude-code-plugin')"
          node --check node_modules/@chio/claude-code-plugin/dist/gateway.js
          node --check node_modules/@chio/claude-code-plugin/scripts/restricted.mjs
          test -f node_modules/@chio/claude-code-plugin/docs/RESTRICTED-MODE.md
          test -f node_modules/@chio/claude-code-plugin/acceptance/2026-09-09/ACCEPTANCE.json
      - name: Retain candidate and hashes
        uses: actions/upload-artifact@v4
        with:
          name: chio-claude-candidate
          path: ${{ runner.temp }}/chio-candidate
          if-no-files-found: error
